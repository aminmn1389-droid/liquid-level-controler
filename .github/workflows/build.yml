name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check project structure
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Root:"
          ls -la
          echo "TankControl:"
          ls -la "$GITHUB_WORKSPACE/TankControl"

      - name: Build debug APK
        working-directory: TankControl
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TankControl-debug-apk
          path: TankControl/app/build/outputs/apk/debug/app-debug.apk
